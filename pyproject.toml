[project]
name = "hoops"
version = "0.1.0"
description = "Basketball broadcast tracking -> court coordinates -> win probability"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "opencv-python>=4.10",
    "torch>=2.5",
    "torchvision>=0.20",
    "rfdetr[loggers,train]>=1.11",
    "supervision>=0.26",
    "trackers>=2.6",
    "ultralytics>=8.4",
    "boxmot>=26.0",
    "scenedetect[opencv]>=0.7",
    "transformers>=4.50",
    "umap-learn>=0.5",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "nba_api>=1.12",
    "pbpstats>=1.3",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=17",
    "filterpy>=1.4",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "tqdm>=4.66",
    "gdown>=5",
    "lap>=0.5.12",
    "trackeval>=1.3",
    "joblib>=1.6.0",
    "roboflow>=1.7.3",
]

[project.optional-dependencies]
cuda = []            # filled on the A100: sam3, SAM2MOT deps, triton
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
hoops = "hoops.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hoops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
